version: 1.0.0
description: >
  Modos de rigor. Un entregable de phases.yaml es obligatorio cuando el modo del proyecto es igual
  o superior a su min_mode. El modo se fija en .ai-dev/methodology.yaml y cambiarlo requiere un CHANGE_REQUEST.

order: [LITE, STANDARD, CRITICAL]

modes:
  LITE:
    purpose: Prototipos, herramientas internas y proyectos personales de bajo riesgo.
    approvals: Una persona responsable puede producir supervisando a la IA y aprobar todas las fases.
    separation_of_duties: false
    traceability_minimum: WARNINGS
    gates_required: [CODE, BUILD, TEST, SECURITY]
    max_autonomy_level: 3
  STANDARD:
    purpose: Productos en producción con usuarios reales.
    approvals: Aprobación humana por fase; quien aprueba no es el agente que produjo el entregable.
    separation_of_duties: true
    traceability_minimum: INTEGRITY_OK
    gates_required: [CODE, BUILD, TEST, SECURITY, TRACEABILITY, VALIDATION, RELEASE]
    max_autonomy_level: 3
  CRITICAL:
    purpose: Salud, finanzas, datos personales sensibles, infraestructura crítica o entornos regulados.
    approvals: Doble aprobación humana en ARCHITECTURE, TECHNOLOGY y RELEASE; aprobador de seguridad obligatorio.
    separation_of_duties: true
    dual_approval_phases: [ARCHITECTURE, TECHNOLOGY, RELEASE]
    traceability_minimum: INTEGRITY_OK
    gates_required: [CODE, BUILD, TEST, SECURITY, TRACEABILITY, VALIDATION, RELEASE]
    max_autonomy_level: 2
