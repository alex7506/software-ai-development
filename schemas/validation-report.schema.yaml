$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ai-dev.local/schemas/validation-report.schema.yaml
title: Informe de validación

type: object
allOf:
  - $ref: "common.schema.yaml#/$defs/document_base"

required: [outcome, checks]
properties:
  document_type: { const: VALIDATION_REPORT }
  document_id:
    type: string
    pattern: "^VAL-[0-9]{3}[A-Z]?$"
  status: { $ref: "enums.schema.yaml#/$defs/document_status" }
  outcome: { $ref: "enums.schema.yaml#/$defs/validation_outcome" }
  traceability_status: { $ref: "enums.schema.yaml#/$defs/integrity_status" }
  checks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [target, result]
      properties:
        target:
          description: Requisito, gate o criterio verificado.
          type: string
        result: { $ref: "enums.schema.yaml#/$defs/check_result" }
        evidence:
          type: array
          items: { $ref: "common.schema.yaml#/$defs/evidence" }
        note: { type: string }
unevaluatedProperties: false
