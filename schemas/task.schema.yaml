$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ai-dev.local/schemas/task.schema.yaml
title: Tarea
description: Frontmatter de una tarea. Implementa los campos del estándar de trabajo (methodology/07-work-standard).

type: object
allOf:
  - $ref: "common.schema.yaml#/$defs/document_base"
  - if:
      properties: { kind: { const: FEATURE } }
    then:
      description: Una tarea FEATURE implementa al menos un requisito.
      required: [relations]
      properties:
        relations:
          type: array
          contains:
            type: object
            required: [type, target]
            properties:
              type: { const: IMPLEMENTS }
              target: { $ref: "common.schema.yaml#/$defs/requirement_id" }
    else:
      description: Las tareas que no son FEATURE justifican su existencia.
      required: [justification]

required: [kind, objective, risk, data_classification, capabilities, executor, acceptance_criteria]
properties:
  document_type: { const: TASK }
  document_id:
    type: string
    pattern: "^TASK-[0-9]{3}[A-Z]?$"
  status: { $ref: "enums.schema.yaml#/$defs/task_status" }
  kind: { $ref: "enums.schema.yaml#/$defs/task_kind" }
  objective: { $ref: "common.schema.yaml#/$defs/non_empty" }
  justification: { $ref: "common.schema.yaml#/$defs/non_empty" }
  constraints:
    type: array
    items: { type: string }
  risk: { $ref: "enums.schema.yaml#/$defs/risk_level" }
  data_classification: { $ref: "enums.schema.yaml#/$defs/data_classification" }
  capabilities:
    type: array
    minItems: 1
    uniqueItems: true
    items: { $ref: "enums.schema.yaml#/$defs/capability" }
  executor: { $ref: "enums.schema.yaml#/$defs/executor" }
  assignee: { type: [string, "null"] }
  reviewed_by: { type: [string, "null"] }
  context_sources:
    type: array
    items: { type: string }
  acceptance_criteria:
    type: array
    minItems: 1
    items: { $ref: "common.schema.yaml#/$defs/acceptance_criterion" }
  blocked_by:
    type: array
    items: { $ref: "common.schema.yaml#/$defs/id" }
  evidence:
    type: array
    items: { $ref: "common.schema.yaml#/$defs/evidence" }
  auto_fix_attempts:
    type: integer
    minimum: 0
unevaluatedProperties: false
