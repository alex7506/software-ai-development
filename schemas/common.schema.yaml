$schema: https://json-schema.org/draft/2020-12/schema
$id: https://ai-dev.local/schemas/common.schema.yaml
title: Definiciones comunes

$defs:
  id:
    type: string
    pattern: "^[A-Z]+-[0-9]{3}[A-Z]?$"
  requirement_id:
    type: string
    pattern: "^N?FR-[0-9]{3}[A-Z]?$"
  semver:
    type: string
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"
  date:
    type: string
    format: date
  datetime:
    type: string
    format: date-time
  non_empty:
    type: string
    minLength: 1

  relation:
    type: object
    additionalProperties: false
    required: [type, target]
    properties:
      type: { $ref: "enums.schema.yaml#/$defs/relation_type" }
      target: { $ref: "#/$defs/id" }
      confidence:
        type: number
        minimum: 0
        maximum: 1
        description: Obligatorio en relaciones inferidas por IA.
      confirmed:
        type: boolean
        description: true cuando una persona confirmó una relación inferida.
      note: { type: string }

  relations:
    type: array
    items: { $ref: "#/$defs/relation" }

  provenance:
    type: object
    additionalProperties: false
    required: [generated_by]
    properties:
      generated_by: { $ref: "#/$defs/non_empty" }
      model: { type: string }
      model_version: { type: string }
      context_ref: { type: string }

  evidence:
    type: object
    additionalProperties: false
    required: [criterion, type, ref]
    properties:
      criterion: { $ref: "#/$defs/non_empty" }
      type:
        enum: [TEST_RUN, REPORT, COMMIT, SCREENSHOT, LOG, REVIEW, MANUAL_CHECK]
      ref: { $ref: "#/$defs/non_empty" }
      recorded_at: { $ref: "#/$defs/date" }

  acceptance_criterion:
    type: object
    additionalProperties: false
    required: [id, description]
    properties:
      id:
        type: string
        pattern: "^AC-[0-9]+$"
      description: { $ref: "#/$defs/non_empty" }

  document_base:
    description: Metadatos comunes a todo documento. `status` lo define cada esquema concreto.
    type: object
    required: [document_id, document_type, title, version, status, project, methodology_version, created_at, updated_at, author, approved_by, source_of_truth]
    properties:
      document_id: { $ref: "#/$defs/id" }
      document_type: { $ref: "enums.schema.yaml#/$defs/document_type" }
      title: { $ref: "#/$defs/non_empty" }
      version: { $ref: "#/$defs/semver" }
      status: true
      project: { $ref: "#/$defs/non_empty" }
      methodology_version: { $ref: "#/$defs/semver" }
      created_at: { $ref: "#/$defs/date" }
      updated_at: { $ref: "#/$defs/date" }
      author: { $ref: "#/$defs/non_empty" }
      approved_by:
        type: [string, "null"]
        description: Persona que aprobó; null mientras no esté aprobado.
      approved_at:
        oneOf:
          - { $ref: "#/$defs/date" }
          - { type: "null" }
      source_of_truth: { type: boolean }
      relations: { $ref: "#/$defs/relations" }
      provenance: { $ref: "#/$defs/provenance" }
      tags:
        type: array
        items: { type: string }
